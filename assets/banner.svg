<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="meterGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ef4444"/><stop offset="35%" stop-color="#f59e0b"/><stop offset="70%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".7"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.04)}}@keyframes sweepLine{0%{transform:translateX(-150px)}}@keyframes needleOscillate{0%{transform:rotate(-35deg)}50%{transform:rotate(45deg)}}@keyframes pillFloat1{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes pillFloat2{0%{transform:translateY(0)}50%{transform:translateY(5px)}}@keyframes dataPulse{0%{stroke-dashoffset:0}50%{stroke-dashoffset:40}}.mono{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;Courier New&apos;,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.radar-needle{transform-origin:1040px 180px;animation:needleOscillate 6s cubic-bezier(.4,0,.2,1) infinite}.flow-wave{stroke-dasharray:12 6;animation:dataPulse 4s linear infinite}.pill-1{animation:pillFloat1 4s ease-in-out infinite}.pill-2{animation:pillFloat2 4.5s ease-in-out infinite}.pill-3{animation:pillFloat1 5s ease-in-out 1s infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1198" height="358" x="1" y="1" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.5" rx="15"/><g stroke="#334155" stroke-opacity=".25" stroke-width=".75"><line x1="80" x2="80" y1="0" y2="360"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="320" x2="320" y1="0" y2="360"/><line x1="440" x2="440" y1="0" y2="360"/><line x1="560" x2="560" y1="0" y2="360"/><line x1="680" x2="680" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="920" x2="920" y1="0" y2="360"/><line x1="1040" x2="1040" y1="0" y2="360"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/></g><path fill="none" stroke="url(#meterGrad)" stroke-opacity=".35" stroke-width="2.5" d="M 0 310 Q 300 250, 600 290 T 1200 260" class="flow-wave"/><g transform="translate(1040, 180)"><circle r="110" fill="#0369a1" filter="url(#glow)" opacity=".12"/><circle r="90" fill="none" stroke="#1e293b" stroke-linecap="round" stroke-width="14"/><circle r="90" fill="none" stroke="url(#meterGrad)" stroke-dasharray="380 200" stroke-dashoffset="100" stroke-linecap="round" stroke-width="14" filter="url(#subtleGlow)"/><circle r="55" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text y="-6" fill="#38bdf8" class="sans" font-size="28" font-weight="800" text-anchor="middle">99</text><text y="16" fill="#94a3b8" class="mono" font-size="11" font-weight="600" text-anchor="middle">SCORE</text><g class="radar-needle"><line x1="0" x2="0" y1="0" y2="-76"