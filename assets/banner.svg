weight="700">INP (RESP.)</text><text x="32" y="34" fill="#38bdf8" class="sans" font-size="13" font-weight="800">42ms (Fast)</text></g><g class="pill-3" transform="translate(60, 48) translate(0, 202) translate(308, 0)"><rect width="138" height="42" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" rx="10"/><circle cx="18" cy="21" r="4" fill="#818cf8"/><text x="32" y="19" fill="#94a3b8" class="mono" font-size="10" font-weight="700">CLS (STABILITY)</text><text x="32" y="34" fill="#818cf8" class="sans" font-size="13" font-weight="800">0.001 (Zero)</text></g><g class="pill-1" transform="translate(60, 48) translate(0, 202) translate(462, 0)"><rect width="138" height="42" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" rx="10"/><circle cx="18" cy="21" r="4" fill="#f59e0b"/><text x="32" y="19" fill="#94a3b8" class="mono" font-size="10" font-weight="700">TTFB (LATENCY)</text><text x="32" y="34" fill="#f59e0b" class="sans" font-size="13" font-weight="800">64ms (Edge)</text></g></g></g></svg>