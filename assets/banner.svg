<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.04); }
    }
    
    @keyframes sweepLine {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(1300px); }
    }

    @keyframes needleOscillate {
      0% { transform: rotate(-35deg); }
      50% { transform: rotate(45deg); }
      100% { transform: rotate(-35deg); }
    }

    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }

    @keyframes dataPulse {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: 40; }
    }

    .radar-needle {
      transform-origin: 1040px 180px;
      animation: needleOscillate 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .flow-wave {
      stroke-dasharray: 12 6;
      animation: dataPulse 4s linear infinite;
    }

    .pill-1 { animation: pillFloat1 4s ease-in-out infinite; }
    .pill-2 { animation: pillFloat2 4.5s ease-in-out infinite; }
    .pill-3 { animation: pillFloat1 5s ease-in-out 1s infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Ambient Energy Wave in Background -->
  <path d="M 0 310 Q 300 250, 600 290 T 1200 260" fill="none" stroke="url(#meterGrad)" stroke-width="2.5" stroke-opacity="0.35" class="flow-wave" />

  <!-- Speedometer / Benchmarking Dial Graphic (Right Anchor, positioned strictly away from title) -->
  <g transform="translate(1040, 180)">
    <!-- Dial Glow Backing -->
    <circle r="110" fill="#0369a1" opacity="0.12" filter="url(#glow)" />
    <!-- Meter Track -->
    <circle r="90" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
    <!-- Meter Active Arc -->
    <circle r="90" fill="none" stroke="url(#meterGrad)" stroke-width="14" stroke-dasharray="380 200" stroke-dashoffset="100" stroke-linecap="round" filter="url(#subtleGlow)" />
    
    <!-- Central Dial Display -->
    <circle r="55" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text text-anchor="middle" y="-6" fill="#38bdf8" font-size="28" font-weight="800" class="sans">99</text>
    <text text-anchor="middle" y="16" fill="#94a3b8" font-size="11" font-weight="600" class="mono">SCORE</text>

    <!-- Needle -->
    <g class="radar-needle">
      <line x1="0" y1="0" x2="0" y2="-76" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" filter="url(#subtleGlow)" />
      <circle cx="0" cy="0" r="7" fill="#f43f5e" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
    
    <text text-anchor="middle" y="75" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">PERF / 100</text>
  </g>

  <!-- Main Hero Titles & Branding (Clear Foreground, No Obstructions) -->
  <g transform="translate(60, 48)">
    <!-- Category Pill Badge -->
    <g>
      <rect width="268" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">CURATED AWESOME LIST</text>
    </g>

    <!-- Primary Title -->
    <text x="0" y="80" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-1" class="sans">
      Website Page Speed &amp;
    </text>
    <text x="0" y="132" fill="#f8fafc" font-size="44" font-weight="900" letter-spacing="-1" class="sans">
      Performance Benchmarking
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="174" fill="#94a3b8" font-size="16.5" font-weight="400" class="sans">
      The authoritative directory of SaaS platforms &amp; open-source auditing tools for Web Vitals &amp; speed.
    </text>

    <!-- Interactive / Floating Performance Metric Badges (Safe lower area, unobstructed) -->
    <g transform="translate(0, 202)">
      <!-- Pill 1: LCP -->
      <g class="pill-1">
        <rect width="138" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
        <circle cx="18" cy="21" r="4" fill="#10b981" />
        <text x="32" y="19" fill="#94a3b8" font-size="10" font-weight="700" class="mono">LCP (SPEED)</text>
        <text x="32" y="34" fill="#10b981" font-size="13" font-weight="800" class="sans">0.82s (Good)</text>
      </g>

      <!-- Pill 2: INP -->
      <g class="pill-2" transform="translate(154, 0)">
        <rect width="138" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="18" cy="21" r="4" fill="#38bdf8" />
        <text x="32" y="19" fill="#94a3b8" font-size="10" font-weight="700" class="mono">INP (RESP.)</text>
        <text x="32" y="34" fill="#38bdf8" font-size="13" font-weight="800" class="sans">42ms (Fast)</text>
      </g>

      <!-- Pill 3: CLS -->
      <g class="pill-3" transform="translate(308, 0)">
        <rect width="138" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
        <circle cx="18" cy="21" r="4" fill="#818cf8" />
        <text x="32" y="19" fill="#94a3b8" font-size="10" font-weight="700" class="mono">CLS (STABILITY)</text>
        <text x="32" y="34" fill="#818cf8" font-size="13" font-weight="800" class="sans">0.001 (Zero)</text>
      </g>

      <!-- Pill 4: TTFB -->
      <g class="pill-1" transform="translate(462, 0)">
        <rect width="138" height="42" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" />
        <circle cx="18" cy="21" r="4" fill="#f59e0b" />
        <text x="32" y="19" fill="#94a3b8" font-size="10" font-weight="700" class="mono">TTFB (LATENCY)</text>
        <text x="32" y="34" fill="#f59e0b" font-size="13" font-weight="800" class="sans">64ms (Edge)</text>
      </g>
    </g>
  </g>
</svg>
